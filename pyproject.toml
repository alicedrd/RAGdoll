[project]
name = "ragdoll"
version = "0.1.0"
description = "A modular and simple RAG system"
readme = "README.md"
authors = [
    { name = "alicedrd", email = "onaircoc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "google-genai>=2.27.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
